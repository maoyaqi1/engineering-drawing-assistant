<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f8">
  <title>工程制图学习助手 · 尺规作图</title>
  <style>
    :root {
      --bg: #eef3f8;
      --panel: #ffffff;
      --line: #c3ccd8;
      --ink: #3b4a60;
      --ink-strong: #16223a;
      --muted: #768397;
      --blue: #1684ff;
      --blue-strong: #0877dd;
      --green: #0b7a45;
      --green-ink: #1a8f4b;
      --red: #c0392b;
      --axis: #9aa6b8;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #ffffff;
      border-bottom: 1px solid #dde3eb;
      flex: 0 0 auto;
    }
    .brand { font-weight: 700; color: var(--ink-strong); font-size: 16px; }
    .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
    .spacer { flex: 1; }
    .home-link {
      color: var(--blue-strong);
      text-decoration: none;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid #c9e3ff;
      border-radius: 8px;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      margin: 12px 16px 6px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 6px 22px rgba(36,55,82,.08);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .status {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      padding: 7px 14px;
      border-radius: 10px;
      background: rgba(22,132,255,.92);
      color: #fff;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      transition: background .2s;
    }
    .status.warn { background: rgba(192,57,43,.92); }

    .player {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 4px 16px rgba(36,55,82,.18);
    }
    .player.show { display: flex; }
    .pbtn {
      border: 0;
      flex: 0 0 auto;
      min-width: 84px;
      height: 38px;
      padding: 0 12px;
      border-radius: 9px;
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .pbtn.ghost { background: #f0f4f9; color: var(--ink); border: 1px solid var(--line); }
    .pstep { flex: 1; min-width: 0; text-align: center; }
    .pcount { color: var(--blue-strong); font-weight: 700; font-size: 13px; }
    .pdesc { color: #4a5a6e; font-size: 12px; margin-top: 2px; }

    .toolbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: #ffffff;
      border-top: 1px solid #dde3eb;
    }
    .tool {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #f5f8fb;
      color: var(--ink);
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    .tool.active {
      border-color: var(--blue);
      background: #eaf3ff;
      color: var(--blue-strong);
      font-weight: 700;
    }
    .tool.danger { color: var(--red); }
    .tool.replay { color: var(--green); border-color: #7ed0a5; background: #eefaf3; }
    .tool.replay.active { border-color: var(--green); background: #d8f4e5; color: var(--green); font-weight: 700; }

    .hint {
      flex: 0 0 auto;
      padding: 0 16px 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (min-width: 900px) {
      .toolbar { grid-template-columns: repeat(10, 1fr); }
    }
  </style>
</head>
<body>
  <header class="app-bar">
    <span class="brand">工程制图学习助手<small>· 尺规作图</small></span>
    <span class="spacer"></span>
    <a class="home-link" href="index.html">← 返回三维课堂</a>
  </header>

  <div class="stage">
    <canvas id="board"></canvas>
    <div class="status" id="status">拖动空白平移 · 双指缩放</div>
    <div class="player" id="player">
      <button class="pbtn ghost" id="playPrev">◀ 上一步</button>
      <div class="pstep">
        <div class="pcount" id="playCount">0 / 0</div>
        <div class="pdesc" id="playDesc">（空白）</div>
      </div>
      <button class="pbtn ghost" id="playAuto">自动 ▶</button>
      <button class="pbtn" id="playNext">下一步 ▶</button>
    </div>
  </div>

  <nav class="toolbar" id="toolbar">
    <button class="tool active" data-t="pan">移动</button>
    <button class="tool" data-t="point">点</button>
    <button class="tool" data-t="line">直尺</button>
    <button class="tool" data-t="centerline">中心线</button>
    <button class="tool" data-t="circle">圆规</button>
    <button class="tool" data-t="select">删除</button>
    <button class="tool" data-t="undo">撤销</button>
    <button class="tool" data-t="redo">重做</button>
    <button class="tool danger" data-t="clear">清空</button>
    <button class="tool replay" data-t="replay">回放</button>
  </nav>

  <div class="hint">
    严格尺规：直尺作实线/中心线，圆规 = 点圆心 → 点半径点 → 按住参考圆拖动画弧（拖满一圈为整圆）。可双击空白回到原点。
  </div>

  <script>
  (function () {
    "use strict";

    // ---------- 纯几何（等价小程序 utils/geo.js） ----------
    var EPS = 1e-9;
    function dist(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx*dx + dy*dy); }
    function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
    function cross(a, b) { return a.x*b.y - a.y*b.x; }
    function lineLineIntersect(p1, p2, p3, p4) {
      var d1 = sub(p2, p1), d2 = sub(p4, p3), den = cross(d1, d2);
      if (Math.abs(den) < EPS) return null;
      var t = cross(sub(p3, p1), d2) / den;
      return { x: p1.x + d1.x*t, y: p1.y + d1.y*t };
    }
    function lineCircleIntersect(p1, p2, c, r) {
      var d = sub(p2, p1), len2 = d.x*d.x + d.y*d.y;
      if (len2 < EPS) return [];
      var f = sub(p1, c), a = len2, b = 2*(f.x*d.x + f.y*d.y),
          cc = f.x*f.x + f.y*f.y - r*r;
      var disc = b*b - 4*a*cc;
      if (disc < -EPS) return [];
      if (disc < 0) disc = 0;
      var s = Math.sqrt(disc), t0 = (-b - s)/(2*a), t1 = (-b + s)/(2*a);
      var res = [{ x: p1.x + d.x*t0, y: p1.y + d.y*t0 }];
      if (s > EPS) res.push({ x: p1.x + d.x*t1, y: p1.y + d.y*t1 });
      return res;
    }
    function circleCircleIntersect(c1, r1, c2, r2) {
      var dx = c2.x - c1.x, dy = c2.y - c1.y, d = Math.sqrt(dx*dx + dy*dy);
      if (d < EPS) return [];
      var a = (r1*r1 - r2*r2 + d*d)/(2*d), h2 = r1*r1 - a*a;
      if (h2 < -EPS) return [];
      var h = h2 > 0 ? Math.sqrt(h2) : 0;
      var mx = c1.x + a*dx/d, my = c1.y + a*dy/d, px = -dy*h/d, py = dx*h/d;
      var res = [{ x: mx + px, y: my + py }];
      if (h > EPS) res.push({ x: mx - px, y: my - py });
      return res;
    }

    // ---------- 状态 ----------
    var state = {
      tool: 'pan', cw: 0, ch: 0, DPR: 1,
      center: { x: 0, y: 0 }, scale: 46,
      objs: [], idSeq: 1, labelIndex: 0,
      pending: [], circleKit: null, reference: null, previewArc: null,
      undoStack: [], redoStack: [], baseDist: 0,
      steps: [], playing: false, playIndex: 0
    };
    var LABELS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    var TWO_PI = Math.PI * 2;
    var HIT_PX = 26, GRID = 1;
    var pointers = {};
    var panning = false, lastPt = null, drawingArc = false;
    var autoTimer = null;

    var canvas = document.getElementById('board');
    var ctx = canvas.getContext('2d');
    var statusEl = document.getElementById('status');
    var playerEl = document.getElementById('player');
    var playCountEl = document.getElementById('playCount');
    var playDescEl = document.getElementById('playDesc');

    function snap(v) { return Math.round(v * 2) / 2; }

    // ---------- 视图映射 ----------
    function worldToScreen(w) {
      return { x: state.cw/2 + (w.x - state.center.x)*state.scale,
               y: state.ch/2 - (w.y - state.center.y)*state.scale };
    }
    function screenToWorld(s) {
      return { x: state.center.x + (s.x - state.cw/2)/state.scale,
               y: state.center.y - (s.y - state.ch/2)/state.scale };
    }

    // ---------- 状态工具 ----------
    function getPoint(id) { return state.objs.find(function(o){ return o.id===id && o.type==='point'; }) || null; }
    function getObj(id) { return state.objs.find(function(o){ return o.id===id; }) || null; }
    function nextLabel() {
      var i = state.labelIndex; state.labelIndex += 1;
      if (i < LABELS.length) return LABELS[i];
      var n = Math.floor(i / LABELS.length);
      return LABELS[i % LABELS.length] + String(n + 1);
    }
    function addPoint(w, auto) {
      var p = { id: state.idSeq++, type: 'point', x: w.x, y: w.y, auto: !!auto, label: nextLabel() };
      state.objs.push(p);
      return p;
    }
    function pointExists(x, y) {
      var tol = 0.06;
      return state.objs.some(function(o){ return o.type==='point' && Math.abs(o.x-x)<=tol && Math.abs(o.y-y)<=tol; });
    }
    function findPointAtScreen(s) {
      var best = null, bestD = HIT_PX;
      state.objs.forEach(function(o){
        if (o.type !== 'point') return;
        var ss = worldToScreen(o), d = Math.hypot(ss.x-s.x, ss.y-s.y);
        if (d <= bestD) { bestD = d; best = o; }
      });
      return best;
    }
    function findObjAtScreen(s) {
      var best = null, bestD = HIT_PX;
      state.objs.forEach(function(o){
        if (o.type === 'point') return;
        var d;
        if (o.type === 'arc') {
          var c = worldToScreen(o.c);
          d = Math.abs(Math.hypot(s.x-c.x, s.y-c.y) - o.r*state.scale);
        } else {
          var a = worldToScreen(o.a), b = worldToScreen(o.b);
          var vx = b.x-a.x, vy = b.y-a.y, L = Math.hypot(vx, vy) || 1;
          d = Math.abs((s.x-a.x)*vy - (s.y-a.y)*vx) / L;
        }
        if (d <= bestD) { bestD = d; best = o; }
      });
      return best;
    }

    // ---------- 撤销 / 重做 ----------
    function snapshot() {
      return JSON.parse(JSON.stringify({ objs: state.objs, center: state.center, scale: state.scale, labelIndex: state.labelIndex }));
    }
    function pushSnapshot() {
      if (state.undoStack.length > 200) state.undoStack.shift();
      state.undoStack.push(snapshot());
      state.redoStack = [];
    }
    function restoreSnap(s) {
      state.objs = s.objs; state.center = s.center; state.scale = s.scale; state.labelIndex = s.labelIndex;
      state.pending = []; state.circleKit = null; state.reference = null; state.previewArc = null; drawingArc = false;
    }
    function undo() {
      if (state.playing) return;
      if (!state.undoStack.length) return;
      state.redoStack.push(snapshot());
      restoreSnap(state.undoStack.pop());
      setStatus(''); redraw();
    }
    function redo() {
      if (state.playing) return;
      if (!state.redoStack.length) return;
      var s = state.redoStack.pop();
      state.undoStack.push(snapshot());
      restoreSnap(s);
      setStatus(''); redraw();
    }

    // ---------- 构造步骤回放 ----------
    function recordStep(desc) {
      if (state.playing) return;
      state.steps.push({ desc: desc, state: snapshot() });
      if (state.steps.length > 200) state.steps.shift();
      state.playIndex = state.steps.length;
    }
    function displayObjs() {
      if (!state.playing) return state.objs;
      if (state.playIndex < 1) return [];
      var s = state.steps[state.playIndex - 1];
      return s ? s.state.objs : [];
    }
    function enterPlayback() {
      if (!state.steps.length) { setStatus('还没有可回放的构造步骤', true); return; }
      state.playing = true; state.playIndex = 0;
      state.pending = []; state.circleKit = null; state.reference = null; state.previewArc = null; drawingArc = false;
      setToolButtons(false);
      playerEl.classList.add('show');
      setStatus('回放中：逐步查看构造过程');
      updatePlayerUI();
      redraw();
    }
    function exitPlayback() {
      state.playing = false;
      stopAuto();
      playerEl.classList.remove('show');
      setToolButtons(state.tool !== 'replay');
      updateToolUI();
      setStatus('已退出回放');
      redraw();
    }
    function playPrev() {
      if (!state.playing) return;
      state.playIndex = Math.max(0, state.playIndex - 1);
      updatePlayerUI(); redraw();
    }
    function playNext() {
      if (!state.playing) return;
      state.playIndex = Math.min(state.steps.length, state.playIndex + 1);
      updatePlayerUI(); redraw();
    }
    function updatePlayerUI() {
      playCountEl.textContent = state.playIndex + ' / ' + state.steps.length;
      if (state.playIndex < 1) { playDescEl.textContent = '（空白）'; }
      else { playDescEl.textContent = state.steps[state.playIndex-1].desc; }
    }
    function startAuto() {
      if (!state.playing) return;
      if (autoTimer) { stopAuto(); return; }
      autoTimer = setInterval(function(){ if (state.playIndex >= state.steps.length) { stopAuto(); return; } playNext(); }, 1100);
      document.getElementById('playAuto').textContent = '暂停';
    }
    function stopAuto() {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
      document.getElementById('playAuto').textContent = '自动 ▶';
    }

    // ---------- 作图 ----------
    function addLine(a, b, centerline) {
      var aP = getPoint(a), bP = getPoint(b);
      if (!aP || !bP) return;
      if (a === b) {
        state.pending = [];
        setStatus('请再点一个不同的点', true); redraw(); return;
      }
      pushSnapshot();
      state.objs.push({ id: state.idSeq++, type: 'line', a: {x:aP.x,y:aP.y}, b: {x:bP.x,y:bP.y},
        centerline: !!centerline, deps: [a, b], color: centerline ? '#7a5bbf' : '#1d63d6' });
      state.pending = [];
      generateIntersections(state.objs[state.objs.length-1]);
      recordStep((centerline ? '作中心线 ' : '作直线 ') + aP.label + bP.label);
      setStatus('');
    }
    function addArc(cId, r, a0, span) {
      var cP = getPoint(cId);
      if (!cP || Math.abs(span) < 0.02) return;
      state.objs.push({ id: state.idSeq++, type: 'arc', c: {x:cP.x,y:cP.y}, r: r, a0: a0, span: span, deps: [cId], color: '#1a8f4b' });
      generateIntersections(state.objs[state.objs.length-1]);
      var full = Math.abs(span) >= TWO_PI - 1e-3;
      recordStep('以 ' + cP.label + ' 为圆心、半径 ' + r.toFixed(1) + (full ? ' 作整圆' : ' 作弧'));
    }
    function generateIntersections(nw) {
      var cands = [];
      state.objs.forEach(function(o){
        if (o.id === nw.id || o.type === 'point') return;
        var pts = [];
        if (nw.type === 'line' && o.type === 'line') {
          var p = lineLineIntersect(nw.a, nw.b, o.a, o.b); if (p) pts.push(p);
        } else if (nw.type === 'line' && o.type === 'arc') {
          pts = lineCircleIntersect(nw.a, nw.b, o.c, o.r).filter(function(p){ return angOnArc(o, p); });
        } else if (nw.type === 'arc' && o.type === 'line') {
          pts = lineCircleIntersect(o.a, o.b, nw.c, nw.r).filter(function(p){ return angOnArc(nw, p); });
        } else if (nw.type === 'arc' && o.type === 'arc') {
          pts = circleCircleIntersect(nw.c, nw.r, o.c, o.r).filter(function(p){ return angOnArc(nw,p) && angOnArc(o,p); });
        }
        pts.forEach(function(p){ cands.push(p); });
      });
      cands.forEach(function(p){ if (!pointExists(p.x, p.y)) addPoint(p, true); });
    }
    function angOnArc(arc, p) {
      var c = worldToScreen(arc.c);
      var s = worldToScreen(p);
      var ang = Math.atan2(s.y - c.y, s.x - c.x);
      var rel = ang - arc.a0;
      if (Math.abs(arc.span) >= TWO_PI - 1e-3) return true;
      if (arc.span >= 0) { if (rel < 0) rel += TWO_PI; return rel <= arc.span + 1e-4; }
      if (rel > 0) rel -= TWO_PI;
      return rel >= arc.span - 1e-4;
    }

    function ensurePoint(pt) {
      var hit = findPointAtScreen(pt);
      if (hit) return hit;
      var w = screenToWorld(pt);
      pushSnapshot();
      return addPoint({ x: snap(w.x), y: snap(w.y) }, false);
    }

    // ---------- 交互（Pointer Events，兼容鼠标+触屏） ----------
    function pointerPos(e) {
      var r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function onPointerDown(e) {
      var pt = pointerPos(e);
      pointers[e.pointerId] = pt;
      var count = Object.keys(pointers).length;
      if (count === 2) {
        var ps = Object.values(pointers);
        state.baseDist = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
        panning = false; stopAuto();
        return;
      }
      if (count > 1) return;

      // 回放模式：仅拖动/缩放
      if (state.playing) { panning = true; lastPt = pt; return; }

      var tool = state.tool;
      if (tool === 'pan') { panning = true; lastPt = pt; return; }
      if (tool === 'select') {
        var o = findObjAtScreen(pt);
        if (o) { deleteObj(o.id); redraw(); }
        return;
      }
      if (tool === 'point') {
        var w = screenToWorld(pt);
        pushSnapshot();
        var p = addPoint({ x: snap(w.x), y: snap(w.y) }, false);
        recordStep('作点 ' + p.label);
        redraw();
        return;
      }
      if (tool === 'circle') { circleTouchStart(pt); return; }
      if (tool === 'line' || tool === 'centerline') {
        var p2 = ensurePoint(pt);
        state.pending.push(p2.id);
        if (state.pending.length === 2) {
          addLine(state.pending[0], state.pending[1], tool === 'centerline');
          redraw();
        } else {
          setStatus('再点一个点（已选 1 个）');
        }
        return;
      }
    }
    function onPointerMove(e) {
      if (pointers[e.pointerId] === undefined) return;
      var pt = pointerPos(e);
      pointers[e.pointerId] = pt;
      var ps = Object.values(pointers);
      if (ps.length >= 2) {
        if (state.baseDist > 0) {
          var d = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
          state.scale = Math.min(240, Math.max(8, state.scale * (d / state.baseDist)));
          state.baseDist = d;
          redraw();
        }
        return;
      }
      if ((panning && !state.playing) || (state.playing && lastPt)) {
        var dx = pt.x - lastPt.x, dy = pt.y - lastPt.y;
        state.center.x -= dx / state.scale;
        state.center.y += dy / state.scale;
        lastPt = pt;
        redraw();
        return;
      }
      if (state.tool === 'circle' && state.circleKit && drawingArc && !state.playing) {
        var cS = worldToScreen(state.previewArc.c);
        var ang = Math.atan2(pt.y - cS.y, pt.x - cS.x);
        var delta = ang - state.circleKit.last;
        if (delta > Math.PI) delta -= TWO_PI; else if (delta < -Math.PI) delta += TWO_PI;
        state.circleKit.end += delta;
        state.circleKit.last = ang;
        state.previewArc.end = state.circleKit.end;
        var span = state.circleKit.end - state.circleKit.a0;
        var deg = Math.round(Math.abs(span) * 180 / Math.PI);
        var full = Math.abs(span) >= TWO_PI - 1e-3;
        setStatus(full ? '已形成整圆，松手完成' : '扫过 ' + deg + '°，松手完成');
        redraw();
      }
    }
    function onPointerUp(e) {
      if (state.tool === 'circle' && state.circleKit && drawingArc && !state.playing) {
        var span = state.circleKit.end - state.circleKit.a0;
        if (Math.abs(span) > 0.02) addArc(state.circleKit.cId, state.circleKit.r, state.circleKit.a0, span);
        state.circleKit = null; state.reference = null; state.previewArc = null; drawingArc = false;
        setStatus('');
        redraw();
      }
      delete pointers[e.pointerId];
      panning = false; state.baseDist = 0;
    }

    function circleTouchStart(pt) {
      if (!state.circleKit) {
        var c = ensurePoint(pt);
        state.circleKit = { cId: c.id, step: 1 };
        setStatus('再点一个点（半径点）');
        redraw(); return;
      }
      if (state.circleKit.step === 1) {
        var rp = ensurePoint(pt);
        var cP = getPoint(state.circleKit.cId);
        var r = dist(cP, rp);
        if (r < 1e-6) { state.circleKit = null; setStatus('半径不能为 0，请重选', true); redraw(); return; }
        state.circleKit.r = r; state.circleKit.step = 2;
        state.reference = { c: {x:cP.x,y:cP.y}, r: r };
        setStatus('按住参考圆拖动，画圆弧/圆');
        redraw(); return;
      }
      // step 2：按住圆周拖动画弧
      var cS = worldToScreen(state.reference.c);
      var d = Math.hypot(pt.x - cS.x, pt.y - cS.y);
      if (Math.abs(d - state.reference.r * state.scale) > 30) {
        setStatus('请按住虚线参考圆上拖动', true); return;
      }
      var ang = Math.atan2(pt.y - cS.y, pt.x - cS.x);
      drawingArc = true;
      state.circleKit.drawing = true;
      state.circleKit.a0 = ang; state.circleKit.end = ang; state.circleKit.last = ang;
      state.previewArc = { c: state.reference.c, r: state.reference.r, a0: ang, end: ang, color: '#1a8f4b' };
      setStatus('沿圆周拖动画弧（半径 ' + state.reference.r.toFixed(1) + '）');
      redraw();
    }

    function deleteObj(id) {
      var obj = getObj(id); if (!obj) return;
      pushSnapshot();
      var toDelete = new Set([id]), changed = true;
      while (changed) {
        changed = false;
        state.objs.forEach(function(o){
          if (toDelete.has(o.id) || o.type === 'point') return;
          if ((o.deps || []).some(function(d){ return toDelete.has(d); })) { toDelete.add(o.id); changed = true; }
        });
      }
      state.objs = state.objs.filter(function(o){ return !toDelete.has(o.id); });
      var used = new Set();
      state.objs.forEach(function(o){ (o.deps || []).forEach(function(d){ used.add(d); }); });
      state.objs = state.objs.filter(function(o){ return o.type !== 'point' || !o.auto || used.has(o.id); });
      state.pending = []; state.circleKit = null; state.reference = null; state.previewArc = null; drawingArc = false;
    }
    function clearAll() {
      if (!state.objs.length) return;
      pushSnapshot();
      state.objs = []; state.pending = []; state.circleKit = null; state.reference = null; state.previewArc = null;
      state.labelIndex = 0; state.steps = []; state.playing = false; state.playIndex = 0; drawingArc = false;
      stopAuto();
      playerEl.classList.remove('show');
      setStatus('已清空'); updateToolUI(); redraw();
    }

    // ---------- 工具选择 ----------
    function setToolButtons(enableOthers) {
      document.querySelectorAll('#toolbar .tool').forEach(function(b){
        var t = b.dataset.t;
        var active = !state.playing && t === state.tool;
        b.classList.toggle('active', active);
      });
    }
    function updateToolUI() {
      document.querySelectorAll('#toolbar .tool').forEach(function(b){
        var t = b.dataset.t;
        b.classList.toggle('active', t === state.tool);
        b.classList.toggle('replay', t === 'replay');
      });
    }
    function onTool(dataT) {
      if (dataT === 'undo') { undo(); return; }
      if (dataT === 'redo') { redo(); return; }
      if (dataT === 'clear') { clearAll(); return; }
      if (dataT === 'replay') {
        if (state.playing) exitPlayback(); else enterPlayback();
        return;
      }
      stopAuto();
      if (state.playing) exitPlayback();
      state.tool = dataT;
      state.pending = []; state.circleKit = null; state.reference = null; state.previewArc = null; drawingArc = false;
      var hint = {
        pan: '拖动空白平移，双指缩放',
        point: '点空白处放置一个点（吸附网格）',
        line: '依次点两点，画一条直线',
        centerline: '依次点两点，画一条点划线（中心线）',
        circle: '①点圆心 ②点半径点 ③按住圆周拖动画弧',
        select: '点击对象可删除'
      };
      setStatus(hint[dataT] || '');
      updateToolUI(); redraw();
    }

    function setStatus(msg, warn) {
      statusEl.textContent = msg || '';
      statusEl.classList.toggle('warn', !!warn);
    }

    // ---------- 绘制 ----------
    function redraw() {
      if (!state.cw || !state.ch) return;
      ctx.clearRect(0, 0, state.cw, state.ch);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, state.cw, state.ch);
      drawGrid(ctx);
      var objs = displayObjs();
      objs.forEach(function(o){
        if (o.type === 'arc') drawArc(ctx, o, 1);
        else if (o.type === 'line') drawLine(ctx, o);
      });
      if (state.previewArc && !state.playing) drawArc(ctx, state.previewArc, 0.85);
      if (state.reference && !state.playing) drawRefCircle(ctx);
      objs.forEach(function(o){ if (o.type === 'point') drawPoint(ctx, o); });
      if (state.pending.length === 1) {
        var p = getPoint(state.pending[0]);
        if (p) drawSelectRing(ctx, p);
      }
    }
    function drawGrid(ctx) {
      var tl = screenToWorld({x:0,y:0}), br = screenToWorld({x:state.cw,y:state.ch});
      var x0 = Math.floor(tl.x/GRID)*GRID, x1 = Math.ceil(br.x/GRID)*GRID;
      var y0 = Math.floor(br.y/GRID)*GRID, y1 = Math.ceil(tl.y/GRID)*GRID;
      ctx.lineWidth = 0.5; ctx.strokeStyle = '#e3e8ee';
      if (state.scale > 20) {
        ctx.beginPath();
        for (var x = x0; x <= x1; x += GRID) { var sx = worldToScreen({x:x,y:0}); ctx.moveTo(sx.x,0); ctx.lineTo(sx.x,state.ch); }
        for (var y = y0; y <= y1; y += GRID) { var sy = worldToScreen({x:0,y:y}); ctx.moveTo(0,sy.y); ctx.lineTo(state.cw,sy.y); }
        ctx.stroke();
      }
      var oy = worldToScreen({x:0,y:0});
      ctx.strokeStyle = '#9aa6b8'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0,oy.y); ctx.lineTo(state.cw,oy.y); ctx.moveTo(oy.x,0); ctx.lineTo(oy.x,state.ch); ctx.stroke();
    }
    function drawLine(ctx, o) {
      var a = worldToScreen({x:o.a.x,y:o.a.y}), b = worldToScreen({x:o.b.x,y:o.b.y});
      var vx = b.x-a.x, vy = b.y-a.y, L = Math.hypot(vx,vy) || 1;
      var ux = vx/L, uy = vy/L, ext = state.cw + state.ch;
      ctx.strokeStyle = o.color; ctx.lineWidth = 2;
      if (o.centerline) { ctx.setLineDash([18,7,4,7]); }
      else { ctx.setLineDash([]); }
      ctx.beginPath();
      ctx.moveTo(a.x - ux*ext, a.y - uy*ext);
      ctx.lineTo(b.x + ux*ext, b.y + uy*ext);
      ctx.stroke(); ctx.setLineDash([]);
    }
    function drawArc(ctx, o, alpha) {
      var c = worldToScreen({x:o.c.x,y:o.c.y}), R = o.r*state.scale;
      var span = o.end != null ? o.end - o.a0 : o.span;
      ctx.strokeStyle = o.color; ctx.globalAlpha = alpha != null ? alpha : 1; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(c.x, c.y, R, o.a0, o.a0 + span, span >= 0 ? false : true);
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    function drawRefCircle(ctx) {
      var c = worldToScreen({x:state.reference.c.x, y:state.reference.c.y});
      ctx.strokeStyle = 'rgba(26,143,75,0.6)'; ctx.lineWidth = 2.2;
      ctx.setLineDash([6,6]); ctx.beginPath();
      ctx.arc(c.x, c.y, state.reference.r*state.scale, 0, TWO_PI);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(26,143,75,0.7)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(c.x-6,c.y); ctx.lineTo(c.x+6,c.y);
      ctx.moveTo(c.x,c.y-6); ctx.lineTo(c.x,c.y+6); ctx.stroke();
    }
    function drawPoint(ctx, p) {
      var s = worldToScreen(p);
      ctx.fillStyle = p.auto ? '#c0392b' : '#16223a';
      ctx.beginPath(); ctx.arc(s.x, s.y, p.auto ? 3 : 4, 0, TWO_PI); ctx.fill();
      if (p.label) {
        ctx.fillStyle = '#3b4a60'; ctx.font = '13px sans-serif';
        ctx.fillText(p.label, s.x + 6, s.y - 6);
      }
    }
    function drawSelectRing(ctx, p) {
      var s = worldToScreen(p);
      ctx.strokeStyle = 'rgba(29,99,214,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, 10, 0, TWO_PI); ctx.stroke();
    }

    // ---------- 初始化 ----------
    function resize() {
      var r = canvas.getBoundingClientRect();
      state.cw = r.width; state.ch = r.height;
      state.DPR = Math.min(window.devicePixelRatio || 1, 3);
      canvas.width = Math.round(state.cw * state.DPR);
      canvas.height = Math.round(state.ch * state.DPR);
      ctx.setTransform(state.DPR, 0, 0, state.DPR, 0, 0);
      redraw();
    }
    function resetView() {
      state.center = { x: 0, y: 0 }; state.scale = 46; redraw();
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('dblclick', resetView);
    window.addEventListener('resize', resize);

    document.querySelectorAll('#toolbar .tool').forEach(function(b){
      b.addEventListener('click', function(){ onTool(b.dataset.t); });
    });
    document.getElementById('playPrev').addEventListener('click', playPrev);
    document.getElementById('playNext').addEventListener('click', playNext);
    document.getElementById('playAuto').addEventListener('click', startAuto);

    resize();
  })();
  </script>
</body>
</html>
